# Tavily mode: the freshness companion reads the watched price through Tavily
# Extract instead of fetching the local demo page directly.
#
#   1. put TAVILY_API_KEY=... in .env (never commit it)
#   2. docker compose -f docker-compose.yml -f docker-compose.tavily.yml up -d
#
# The watched page is the public GitHub Pages copy of the demo page:
#   https://madhusudhanm23.github.io/bifrost-fresh-cache/acme-pricing/
# (source: docs/acme-pricing/index.html). Tavily cannot read pages that only
# exist on your machine, which is why this mode needs a public page.
#
# Cost: each freshness check that is not answered from the companion's short
# evidence cache is one Tavily Extract call (basic extract = 1 credit per 5 pages).
services:
  freshness-companion:
    command:
      - "/usr/local/bin/freshness-companion"
      - "-listen=:8090"
      - "-bifrost=http://bifrost:8080"
      - "-policy=/app/policy.json"
      - "-provider=tavily_extract"
      - "-evidence-ttl=5s"
      # Smart checking / watcher: off by default (same variables as docker-compose.yml).
      # The watcher cap defaults lower here because every watcher fetch is a Tavily call.
      - "-check-adaptive=${CHECK_ADAPTIVE:-false}"
      - "-check-max=${CHECK_MAX:-60s}"
      - "-watch=${WATCH:-false}"
      - "-watch-max-per-hour=${WATCH_MAX_PER_HOUR:-30}"
      # Tavily finds the source: OFF by default. DISCOVER=true lets the companion
      # search for a source page (Tavily Search, 1 credit per search, capped per
      # hour) when no watched fact covers a price question. Tavily Search receives
      # only a short query built from the policy's "discover" template and the
      # allowlisted names in the question. To see it, mount
      # docker/policy.discover.json (no watched facts); see DOCKER.md.
      - "-discover=${DISCOVER:-false}"
      - "-discover-max-per-hour=${DISCOVER_MAX_PER_HOUR:-10}"
      - "-audit-rate=1"
      - "-audit-near-margin=0.05"
      - "-audit-max-per-minute=120"
      - "-verify-below=0.90"
      - "-verified=/app/verified.json"
    volumes:
      # TAVILY_POLICY=policy.discover.json (no watched facts) shows discovery; see DOCKER.md.
      - ./docker/${TAVILY_POLICY:-policy.tavily.json}:/app/policy.json:ro
